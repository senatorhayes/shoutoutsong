<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Checkout Canceled – Shoutout Song</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(1200px 600px at top, #1a1f3a, #0b0f1a);
      color: #f5f7ff;
      min-height: 100vh;
    }
    .card {
      max-width: 560px;
      margin: 40px auto;
      padding: 32px;
      background: rgba(255,255,255,0.04);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
    }
    @media (max-width: 600px) { .card { margin: 16px; padding: 24px; } }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255, 138, 60, 0.15);
      color: #ff8a3c;
      border-radius: 999px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 2rem; margin: 0 0 10px; }
    p { color: #b9c0ff; line-height: 1.6; }
    .actions { margin-top: 28px; display: grid; gap: 14px; }
    .btn {
      display: block;
      text-align: center;
      padding: 16px;
      font-size: 1.05rem;
      border-radius: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .primary { background: linear-gradient(135deg, #ff7a18, #ff3d81); color: #fff; }
    .secondary { background: rgba(255,255,255,0.08); color: #f5f7ff; }
  </style>
  <script async src="https://plausible.io/js/pa-Lr_14gVhbTd58se5r3yzQ.js"></script>
  <script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};plausible.init()</script>
</head>
<body>
  <div class="card">
    <div class="badge">Checkout canceled</div>
    <h1>No worries, you weren't charged.</h1>
    <p id="msg">Your song is still waiting for you. Go back to preview it again or buy it whenever you're ready.</p>
    <div class="actions">
      <a class="btn primary" id="backBtn" href="/?resume=1#create">🎵 Back to my song</a>
      <a class="btn secondary" href="/#create">Make a different song</a>
    </div>
  </div>
  <script>
    // If the song can't be restored (e.g. opened in a new tab), don't promise it
    try {
      if (!sessionStorage.getItem("sosCheckoutSong")) {
        document.getElementById("msg").textContent = "You can make a new song any time. Previews are always free.";
        document.getElementById("backBtn").textContent = "🎵 Make a song";
        document.getElementById("backBtn").href = "/#create";
      }
    } catch (e) {}
  </script>
</body>
</html>
